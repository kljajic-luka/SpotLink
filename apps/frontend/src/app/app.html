<header class="shell-header">
  <a routerLink="/" class="brand" aria-label="SpotLink home">
    <span class="brand__mark" aria-hidden="true"></span>
    <span>SpotLink Operativa</span>
  </a>

  <nav class="shell-nav" aria-label="Primary">
    @if (canOpenOperator()) {
      <a routerLink="/operator">Operator</a>
    }
    @if (canOpenAdmin()) {
      <a routerLink="/admin">Admin</a>
      <a routerLink="/foundation">Foundation</a>
    }
  </nav>

  <div class="shell-actions">
    <sl-status-pill tone="success">Beograd pilot</sl-status-pill>
    @if (auth.isAuthenticated()) {
      <sl-ui-button variant="secondary" size="sm" (clicked)="logout()">Logout</sl-ui-button>
    } @else {
      <a routerLink="/login" class="shell-login">Login</a>
    }
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
