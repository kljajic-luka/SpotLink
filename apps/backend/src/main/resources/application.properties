spring.application.name=spotlink-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:spotlink;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true

springdoc.api-docs.path=/openapi
springdoc.swagger-ui.path=/swagger-ui

spotlink.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200}
spotlink.cookie.secure=${COOKIE_SECURE:false}
spotlink.cookie.domain=${COOKIE_DOMAIN:}
spotlink.cookie.same-site=${COOKIE_SAME_SITE:Lax}
spotlink.cookie.session-ttl-hours=${SESSION_TTL_HOURS:12}
spotlink.default-currency=${SPOTLINK_DEFAULT_CURRENCY:RSD}
spotlink.quote-ttl-minutes=${QUOTE_TTL_MINUTES:15}
spotlink.booking-slot-minutes=${BOOKING_SLOT_MINUTES:15}
spotlink.min-reservation-minutes=${MIN_RESERVATION_MINUTES:15}
spotlink.max-reservation-days=${MAX_RESERVATION_DAYS:30}
spotlink.manual-confirmation-ttl-hours=${MANUAL_CONFIRMATION_TTL_HOURS:24}
spotlink.payment.provider=${PAYMENT_PROVIDER:mock}
spotlink.payment.online-enabled=${ONLINE_PAYMENTS_ENABLED:true}
spotlink.mock-payment.enabled=${MOCK_PAYMENT_ENABLED:true}
# JWT za mobilni bearer auth – zameniti sigurnim 32+ byte secret string-om na produkciji
spotlink.jwt.secret=${JWT_SECRET:c3BvdGxpbmstZGV2LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n}
spotlink.jwt.expiry-days=${JWT_EXPIRY_DAYS:7}
spotlink.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
spotlink.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}
spotlink.jwt.issuer=${JWT_ISSUER:spotlink}
spotlink.jwt.audience=${JWT_AUDIENCE:spotlink-mobile}

logging.level.com.spotlink=${SPOTLINK_LOG_LEVEL:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{requestId:-no-req}] %-5level %logger{36} - %msg%n
