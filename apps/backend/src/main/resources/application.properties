spring.application.name=spotlink-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:spotlink;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true

springdoc.api-docs.path=/openapi
springdoc.swagger-ui.path=/swagger-ui

spotlink.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200}
spotlink.cookie.secure=${COOKIE_SECURE:false}
spotlink.cookie.domain=${COOKIE_DOMAIN:}
spotlink.cookie.same-site=${COOKIE_SAME_SITE:Lax}
spotlink.cookie.session-ttl-hours=${SESSION_TTL_HOURS:12}
spotlink.default-currency=${SPOTLINK_DEFAULT_CURRENCY:RSD}
spotlink.quote-ttl-minutes=${QUOTE_TTL_MINUTES:15}
spotlink.booking-slot-minutes=${BOOKING_SLOT_MINUTES:15}
spotlink.min-reservation-minutes=${MIN_RESERVATION_MINUTES:15}
spotlink.max-reservation-days=${MAX_RESERVATION_DAYS:30}
spotlink.manual-confirmation-ttl-hours=${MANUAL_CONFIRMATION_TTL_HOURS:24}
spotlink.payment.provider=${PAYMENT_PROVIDER:mock}
spotlink.payment.online-enabled=${ONLINE_PAYMENTS_ENABLED:true}
spotlink.mock-payment.enabled=${MOCK_PAYMENT_ENABLED:true}
spotlink.password-reset.delivery-enabled=${PASSWORD_RESET_DELIVERY_ENABLED:true}
spotlink.password-reset.reset-url=${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
spotlink.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
spotlink.mail.provider=${MAIL_PROVIDER:safe-log}
spotlink.mail.smtp.host=${SMTP_HOST:}
spotlink.mail.smtp.port=${SMTP_PORT:587}
spotlink.mail.smtp.username=${SMTP_USERNAME:}
spotlink.mail.smtp.password=${SMTP_PASSWORD:}
spotlink.mail.smtp.from=${SMTP_FROM:}
spotlink.mail.smtp.starttls-enabled=${SMTP_STARTTLS_ENABLED:true}
spotlink.mail.smtp.auth-enabled=${SMTP_AUTH_ENABLED:true}
spotlink.mail.smtp.connection-timeout-ms=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spotlink.mail.smtp.read-timeout-ms=${SMTP_READ_TIMEOUT_MS:5000}
spotlink.mail.smtp.write-timeout-ms=${SMTP_WRITE_TIMEOUT_MS:5000}
spotlink.push.delivery-enabled=${PUSH_DELIVERY_ENABLED:false}
spotlink.push.provider=${PUSH_PROVIDER:none}
spotlink.push.apns.environment=${APNS_ENVIRONMENT:sandbox}
spotlink.push.apns.bundle-id=${APNS_BUNDLE_ID:}
spotlink.push.apns.team-id=${APNS_TEAM_ID:}
spotlink.push.apns.key-id=${APNS_KEY_ID:}
spotlink.push.apns.private-key=${APNS_PRIVATE_KEY:}
spotlink.push.apns.private-key-path=${APNS_PRIVATE_KEY_PATH:}
spotlink.push.apns.request-timeout-seconds=${APNS_REQUEST_TIMEOUT_SECONDS:10}
spotlink.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
spotlink.rate-limit.login.permits=${RATE_LIMIT_LOGIN_PERMITS:10}
spotlink.rate-limit.login.window=${RATE_LIMIT_LOGIN_WINDOW:60s}
spotlink.rate-limit.mobile-token.permits=${RATE_LIMIT_MOBILE_TOKEN_PERMITS:10}
spotlink.rate-limit.mobile-token.window=${RATE_LIMIT_MOBILE_TOKEN_WINDOW:60s}
spotlink.rate-limit.registration.permits=${RATE_LIMIT_REGISTRATION_PERMITS:5}
spotlink.rate-limit.registration.window=${RATE_LIMIT_REGISTRATION_WINDOW:60s}
spotlink.rate-limit.password-reset-request.permits=${RATE_LIMIT_PASSWORD_RESET_REQUEST_PERMITS:5}
spotlink.rate-limit.password-reset-request.window=${RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW:60s}
spotlink.rate-limit.password-reset-complete.permits=${RATE_LIMIT_PASSWORD_RESET_COMPLETE_PERMITS:10}
spotlink.rate-limit.password-reset-complete.window=${RATE_LIMIT_PASSWORD_RESET_COMPLETE_WINDOW:60s}
spotlink.rate-limit.analytics.permits=${RATE_LIMIT_ANALYTICS_PERMITS:60}
spotlink.rate-limit.analytics.window=${RATE_LIMIT_ANALYTICS_WINDOW:60s}
spotlink.auth-lockout.enabled=${AUTH_LOCKOUT_ENABLED:true}
spotlink.auth-lockout.failed-attempt-threshold=${AUTH_LOCKOUT_FAILED_ATTEMPT_THRESHOLD:5}
spotlink.auth-lockout.rolling-window=${AUTH_LOCKOUT_ROLLING_WINDOW:15m}
spotlink.auth-lockout.lockout-duration=${AUTH_LOCKOUT_DURATION:15m}
# JWT za mobilni bearer auth – zameniti sigurnim 32+ byte secret string-om na produkciji
spotlink.jwt.secret=${JWT_SECRET:c3BvdGxpbmstZGV2LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n}
spotlink.jwt.expiry-days=${JWT_EXPIRY_DAYS:7}
spotlink.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
spotlink.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}
spotlink.jwt.issuer=${JWT_ISSUER:spotlink}
spotlink.jwt.audience=${JWT_AUDIENCE:spotlink-mobile}

logging.level.com.spotlink=${SPOTLINK_LOG_LEVEL:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{requestId:-no-req}] %-5level %logger{36} - %msg%n
