name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-reservation-gate:
    name: Backend reservation gate (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Podesavanje JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Pokretanje reservation/operator test slice-a
        run: mvn -B -f apps/backend/pom.xml -Dtest=BookingOpsHardeningTest,ReservationFoundationTest,LocationSearchFoundationTest,RoleAccessControlTest test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_DRIVER: ${{ secrets.DATABASE_DRIVER }}

  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Podesavanje JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Pokretanje backend testova
        run: mvn -B -f apps/backend/pom.xml test
        env:
          # Testovi koriste @ActiveProfiles("test") i H2 in-memory bazu.
          # Produkcione DATABASE_* varijable su dostupne ako je potrebno pokrenuti
          # integracionе testove prema Supabase PostgreSQL instanci.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_DRIVER: ${{ secrets.DATABASE_DRIVER }}

  frontend:
    name: Frontend (Node 22 / Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Podesavanje Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalacija zavisnosti
        run: npm ci --prefix apps/frontend

      - name: Pokretanje testova (headless)
        run: npm --prefix apps/frontend run test:ci

      - name: Produkcioni build
        run: npm --prefix apps/frontend run build:ci

  ios:
    name: iOS (Swift Package / Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracija Mapbox downloads tokena
        run: |
          echo "machine api.mapbox.com login mapbox password ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      - name: Ciscenje Swift build artifakata
        run: swift package clean --package-path apps/ios/SpotLink

      - name: Pokretanje Swift testova
        run: swift test --package-path apps/ios/SpotLink

      - name: Izbor dostupnog iOS simulatora
        id: ios-simulator
        run: |
          xcrun simctl list devices available
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data = json.load(sys.stdin); devices = [device for runtime in data.get("devices", {}).values() for device in runtime if device.get("isAvailable")]; iphones = [device for device in devices if device.get("name", "").startswith("iPhone")]; selected = (iphones or devices); print(selected[0]["udid"] if selected else "")')"
          if [ -z "${SIMULATOR_UDID}" ]; then
            echo "::error::No available iOS simulators found for Xcode tests."
            exit 1
          fi
          echo "udid=${SIMULATOR_UDID}" >> "$GITHUB_OUTPUT"

      - name: Xcode test (SpotLinkApp)
        run: |
          xcodebuild test \
            -project apps/ios/SpotLink.xcodeproj \
            -scheme SpotLinkApp \
            -destination 'platform=iOS Simulator,id=${{ steps.ios-simulator.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Xcode unsigned Release build (generic iOS)
        run: |
          xcodebuild build \
            -project apps/ios/SpotLink.xcodeproj \
            -scheme SpotLinkApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
