openapi: 3.1.0
info:
  title: SpotLink Mobile API Contract
  version: 0.1.0-mobile-draft
  summary: Mobile-facing contract for the current SpotLink backend snapshot.
  description: >
    This draft mirrors the current unversioned backend paths under /api. A
    /api/v1 compatibility surface is now implemented for mobile-critical
    endpoints with the same controller logic and DTOs.
x-spotlink-v1-alias: "Every /api path listed here is also exposed as /api/v1 by inserting /v1 after /api, for example /api/auth/token -> /api/v1/auth/token."
servers:
  - url: https://api.spotlink.app
    description: Production candidate
  - url: https://api-staging.spotlink.app
    description: Staging candidate
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Vehicles
  - name: Locations
  - name: Reservations
  - name: Payments
  - name: Support
  - name: Notifications
  - name: Operator
  - name: Admin
  - name: Analytics
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                up:
                  value:
                    status: UP
                    service: spotlink-backend
                    timestamp: "2026-04-22T13:00:00Z"

  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Cookie/session login
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              login:
                value:
                  email: casey.customer@example.com
                  password: CorrectHorse123
      responses:
        "200":
          description: Authenticated cookie session
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/token:
    post:
      tags: [Auth]
      security: []
      summary: Mobile bearer token login
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenRequest"
            examples:
              token:
                value:
                  email: casey.customer@example.com
                  password: CorrectHorse123
      responses:
        "200":
          description: Mobile access token
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
              examples:
                token:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiJ9.example.signature
                    refreshToken: sl_refresh_example
                    tokenType: Bearer
                    expiresIn: 900
                    expiresInSeconds: 900
                    refreshExpiresInSeconds: 2592000
                    issuedAt: "2026-04-22T13:00:00Z"
                    expiresAt: "2026-04-22T13:15:00Z"
                    refreshExpiresAt: "2026-05-22T13:00:00Z"
                    user:
                      id: 11111111-1111-4111-8111-111111111111
                      email: casey.customer@example.com
                      firstName: Casey
                      lastName: Customer
                      phone: "+15551234567"
                      avatarUrl: null
                      bio: null
                      roles: [CUSTOMER]
                      operatorId: null
                      registrationStatus: ACTIVE
                      createdAt: "2026-04-22T12:00:00Z"
                    roles: [CUSTOMER]
        default:
          $ref: "#/components/responses/Error"

  /api/auth/token/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate mobile refresh token and issue new access token
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Rotated mobile token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/token/revoke:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
        - {}
      summary: Revoke mobile refresh token or all current user's refresh tokens
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeTokenRequest"
      responses:
        "204":
          description: Revoked; no response body
        default:
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "204":
          description: Logged out; no response body
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              examples:
                user:
                  $ref: "#/components/examples/UserProfile"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/register/customer:
    post:
      tags: [Auth]
      security: []
      summary: Register customer
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerRequest"
      responses:
        "201":
          description: Customer registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/register/operator:
    post:
      tags: [Auth]
      security: []
      summary: Register operator
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOperatorRequest"
      responses:
        "201":
          description: Operator registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/password/reset-request:
    post:
      tags: [Auth]
      security: []
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Accepted; no response body
        default:
          $ref: "#/components/responses/Error"

  /api/auth/password/reset:
    post:
      tags: [Auth]
      security: []
      summary: Complete password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          description: Password reset; no response body
        default:
          $ref: "#/components/responses/Error"

  /api/users/me/profile:
    get:
      tags: [Profile]
      summary: Current user's profile details
      responses:
        "200":
          description: Profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileDetails"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Profile]
      summary: Update profile and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileDetails"
        default:
          $ref: "#/components/responses/Error"

  /api/users/{userId}/profile:
    get:
      tags: [Profile]
      summary: User profile by ID; foundation currently exposes self only
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileDetails"
        default:
          $ref: "#/components/responses/Error"

  /api/vehicles/me:
    get:
      tags: [Vehicles]
      summary: List current user's vehicles
      responses:
        "200":
          description: Vehicle list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleProfile"
        default:
          $ref: "#/components/responses/Error"

  /api/vehicles:
    post:
      tags: [Vehicles]
      summary: Create vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpsertRequest"
      responses:
        "201":
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleProfile"
        default:
          $ref: "#/components/responses/Error"

  /api/vehicles/{vehicleId}:
    put:
      tags: [Vehicles]
      summary: Update vehicle
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpsertRequest"
      responses:
        "200":
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleProfile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Vehicles]
      summary: Delete vehicle
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "204":
          description: Vehicle deleted; no response body
        default:
          $ref: "#/components/responses/Error"

  /api/locations/search:
    get:
      tags: [Locations]
      security: []
      summary: Search parking locations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: latitude
          schema:
            type: number
        - in: query
          name: longitude
          schema:
            type: number
        - in: query
          name: radiusKm
          schema:
            type: number
            minimum: 0.1
        - in: query
          name: resourceTypes
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ParkingResourceType"
          style: form
          explode: true
        - in: query
          name: evChargingRequired
          schema:
            type: boolean
        - in: query
          name: startsAt
          schema:
            type: string
            format: date-time
        - in: query
          name: endsAt
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paged location search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchPage"
        default:
          $ref: "#/components/responses/Error"

  /api/locations/geocode:
    get:
      tags: [Locations]
      security: []
      summary: Geocode suggestions
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeocodeSuggestion"
        default:
          $ref: "#/components/responses/Error"

  /api/locations/{locationId}:
    get:
      tags: [Locations]
      security: []
      summary: Parking location detail
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Parking location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingLocation"
        default:
          $ref: "#/components/responses/Error"

  /api/locations/{locationId}/resources:
    get:
      tags: [Locations]
      security: []
      summary: Parking resources for a location
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Parking resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParkingResource"
        default:
          $ref: "#/components/responses/Error"

  /api/reservations/me:
    get:
      tags: [Reservations]
      summary: Current user's reservations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged reservations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationPage"
        default:
          $ref: "#/components/responses/Error"

  /api/reservations/{reservationId}:
    get:
      tags: [Reservations]
      summary: Reservation detail
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        default:
          $ref: "#/components/responses/Error"

  /api/reservations/quote:
    post:
      tags: [Reservations]
      summary: Quote reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationQuoteRequest"
      responses:
        "200":
          description: Reservation quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationQuote"
        default:
          $ref: "#/components/responses/Error"

  /api/reservations:
    post:
      tags: [Reservations]
      summary: Create reservation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reservation created
          headers:
            X-Idempotency-Key:
              $ref: "#/components/headers/IdempotencyKey"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        default:
          $ref: "#/components/responses/Error"

  /api/reservations/{reservationId}/cancel:
    post:
      tags: [Reservations]
      summary: Cancel reservation
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservationRequest"
      responses:
        "200":
          description: Cancelled reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        default:
          $ref: "#/components/responses/Error"

  /api/payments/methods:
    get:
      tags: [Payments]
      summary: Payment methods
      responses:
        "200":
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"
        default:
          $ref: "#/components/responses/Error"

  /api/payments/intents:
    post:
      tags: [Payments]
      summary: Create payment intent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntentRequest"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        default:
          $ref: "#/components/responses/Error"

  /api/payments/intents/{paymentIntentId}/confirm:
    post:
      tags: [Payments]
      summary: Confirm payment intent
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Provider result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProviderResult"
        default:
          $ref: "#/components/responses/Error"

  /api/support/tickets:
    get:
      tags: [Support]
      summary: List support tickets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged support tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Support]
      summary: Create support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketRequest"
      responses:
        "201":
          description: Support ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        default:
          $ref: "#/components/responses/Error"

  /api/support/tickets/{ticketId}/messages:
    get:
      tags: [Support]
      summary: List support messages
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportMessage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Support]
      summary: Create support message
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportMessageRequest"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
        default:
          $ref: "#/components/responses/Error"

  /api/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        default:
          $ref: "#/components/responses/Error"

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Unread notification count
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCount"
        default:
          $ref: "#/components/responses/Error"

  /api/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark notification read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Marked read; no response body
        default:
          $ref: "#/components/responses/Error"

  /api/notifications/device-tokens:
    post:
      tags: [Notifications]
      summary: Register device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceTokenRequest"
      responses:
        "204":
          description: Token registered; no response body
        default:
          $ref: "#/components/responses/Error"

  /api/operator/me:
    get:
      tags: [Operator]
      summary: Current operator account
      responses:
        "200":
          description: Operator account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAccount"
        default:
          $ref: "#/components/responses/Error"

  /api/operator/dashboard/summary:
    get:
      tags: [Operator]
      summary: Operator dashboard summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorDashboardSummary"
        default:
          $ref: "#/components/responses/Error"

  /api/operator/resources/health:
    get:
      tags: [Operator]
      summary: Operator resource health
      responses:
        "200":
          description: Resource health list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorResourceHealth"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/dashboard/summary:
    get:
      tags: [Admin]
      summary: Admin dashboard summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardSummary"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/users:
    get:
      tags: [Admin]
      summary: Admin user list
      parameters:
        - $ref: "#/components/parameters/Page"
        - in: query
          name: size
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paged users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/audit-events:
    get:
      tags: [Admin]
      summary: Admin audit events
      parameters:
        - $ref: "#/components/parameters/Page"
        - in: query
          name: size
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paged audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditEventPage"
        default:
          $ref: "#/components/responses/Error"

  /api/analytics/events:
    post:
      tags: [Analytics]
      security: []
      summary: Ingest analytics event batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsBatch"
      responses:
        "202":
          description: Accepted; no response body
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Current recommended native iOS auth model.
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Current browser/session auth model.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Required for cookie/session state-changing browser requests.

  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
      description: Client-generated correlation ID.
    IdempotencyKeyHeader:
      in: header
      name: X-Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 160
      description: Future-safe idempotency header. Current backend still requires body idempotencyKey.
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      in: query
      name: size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    VehicleId:
      in: path
      name: vehicleId
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      in: path
      name: locationId
      required: true
      schema:
        type: string
        format: uuid
    ReservationId:
      in: path
      name: reservationId
      required: true
      schema:
        type: string
        format: uuid
    PaymentIntentId:
      in: path
      name: paymentIntentId
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      in: path
      name: ticketId
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      in: path
      name: notificationId
      required: true
